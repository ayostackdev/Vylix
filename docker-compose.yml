services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vylix
      POSTGRES_PASSWORD: vylix
      POSTGRES_DB: vylix
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U vylix
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      target: api-run
    ports:
      - 4000:4000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vylix:vylix@postgres:5432/vylix
      DIRECT_URL: postgresql://vylix:vylix@postgres:5432/vylix
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_storage:/app/storage
      - api_tmp:/app/tmp

  worker:
    build:
      context: ./apps/api
      target: worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vylix:vylix@postgres:5432/vylix
      DIRECT_URL: postgresql://vylix:vylix@postgres:5432/vylix
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - api_storage:/app/storage
      - api_tmp:/app/tmp

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - 3000:3000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:4000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  api_storage:
  api_tmp:
