services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vylix
      POSTGRES_PASSWORD: vylix
      POSTGRES_DB: vylix
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U vylix
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api-run
    ports:
      - 4000:4000
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://vylix:vylix@postgres:5432/vylix
      DIRECT_URL: postgresql://vylix:vylix@postgres:5432/vylix
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHON_SERVICE_URL: http://python-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_started
    volumes:
      - ./apps/api/prisma:/app/apps/api/prisma

  worker:
    build:
      context: .
      target: api-run
    command: ["node", "apps/api/dist/worker"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vylix:vylix@postgres:5432/vylix
      DIRECT_URL: postgresql://vylix:vylix@postgres:5432/vylix
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHON_SERVICE_URL: http://python-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_started
    restart: unless-stopped

  python-service:
    build:
      context: ./apps/python-service
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      API_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:3000,http://localhost:4000
      POSTGRES_DSN: postgresql://vylix:vylix@postgres:5432/vylix
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MAX_UPLOAD_MB: 50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - python_storage:/app/storage
      - python_tmp:/app/tmp

  web:
    build:
      context: .
      target: web-run
    ports:
      - 3000:3000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:4000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  python_storage:
  python_tmp:
