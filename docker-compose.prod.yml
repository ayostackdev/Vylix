# Log rotation: the default json-file driver never rotates, so a long-lived VPS
# fills its disk with container logs (docling/OCR traces are chatty). 10 MB x 3
# files per service is plenty for a 12 GB box.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    # volatile-lru only evicts TTL'd keys (rate-limit counters, caches), so
    # Celery broker keys (db 2, no TTL) can never be silently dropped.
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
    # maxmemory is 256mb; the cgroup ceiling leaves headroom for the process
    # overhead Redis adds on top of the dataset.
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    logging: *default-logging
    restart: unless-stopped

  # Dedicated Redis for Celery broker + results.
  # Isolating prevents Celery result TTLs from evicting API rate-limit keys.
  redis-celery:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_celery_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    logging: *default-logging
    restart: unless-stopped

  # TURN relay for WebRTC. Needed when peers sit behind symmetric NAT or
  # restrictive campus Wi-Fi, where direct P2P media cannot connect.
  # Host networking lets coturn advertise the VPS public IP and bind the whole
  # UDP relay range without mapping 100+ ports. Open these in the Contabo
  # firewall: 3478/udp, 3478/tcp, and 49160-49300/udp.
  # Uses the same WEBRTC_TURN_SECRET as the API (`--use-auth-secret`), so the
  # browser only ever receives short-lived HMAC credentials.
  coturn:
    image: coturn/coturn:4.6-alpine
    # Opt-in: deploy.sh enables this profile automatically when
    # WEBRTC_TURN_SECRET is set. Manual runs need `--profile turn`.
    profiles: ["turn"]
    network_mode: host
    env_file:
      - .env.production
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        exec turnserver
        --use-auth-secret
        --static-auth-secret="$${WEBRTC_TURN_SECRET:?WEBRTC_TURN_SECRET must be set}"
        --realm="$${TURN_REALM:-vylix.app}"
        $${TURN_EXTERNAL_IP:+--external-ip=$${TURN_EXTERNAL_IP}}
        --listening-port="$${TURN_PORT:-3478}"
        --min-port="$${TURN_MIN_PORT:-49160}"
        --max-port="$${TURN_MAX_PORT:-49300}"
        --no-cli
        --no-tls
        --no-dtls
        --fingerprint
        --no-multicast-peers
        --log-file=stdout
    mem_limit: ${TURN_MEM_LIMIT:-256m}
    logging: *default-logging
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      target: api-lean
    # No host port publish: replicas are reached by Caddy over the compose
    # network (DNS name `api`), so `--scale api=N` works without port clashes.
    expose:
      - "4000"
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis-celery:6379/0
      CELERY_RESULT_BACKEND: redis://redis-celery:6379/1
      # Pin pgvector in prod: the Chroma fallback is a SQLite-backed local
      # index on the shared api_tmp volume — it corrupts/locks when the api
      # and worker containers (or multiple replicas) touch it concurrently.
      VECTOR_STORE_BACKEND: pgvector
    depends_on:
      redis:
        condition: service_healthy
      redis-celery:
        condition: service_healthy
    volumes:
      - api_storage:/app/storage
      - api_tmp:/app/tmp
    # Lean API is ~600 MB per uvicorn worker; 2 GB covers 1-2 workers plus a
    # request burst. The BGE-M3 overlay raises this to 4g (see §8 of
    # docs/architecture/contabo-deployment.md).
    mem_limit: ${API_MEM_LIMIT:-2g}
    mem_reservation: ${API_MEM_RESERVATION:-512m}
    logging: *default-logging
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
      target: worker
    # Override the image CMD so Celery concurrency is tunable without a
    # rebuild. The image CMD is exec-form (JSON), so it cannot expand
    # ${CELERY_CONCURRENCY} at runtime — a compose `command:` override is the
    # only way to change it. Mirrors the flags in apps/api/Dockerfile; keep the
    # two in sync if you change either.
    # Concurrency 1 on a small VPS: each Celery process parsing a PDF through
    # docling/OCR can peak near 2 GB, so two at once is how a 12 GB box OOMs.
    command:
      - celery
      - -A
      - app.core.celery_app.celery_app
      - worker
      - --loglevel=info
      - --concurrency=${CELERY_CONCURRENCY:-1}
    env_file:
      - .env.production
    environment:
      CELERY_BROKER_URL: redis://redis-celery:6379/0
      CELERY_RESULT_BACKEND: redis://redis-celery:6379/1
      VECTOR_STORE_BACKEND: pgvector
    depends_on:
      redis-celery:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - api_storage:/app/storage
      - api_tmp:/app/tmp
    # The worker is the real RAM hog — it parses PDFs (docling/OCR), not the
    # API. 4 GB covers one heavy parse; the BGE-M3 overlay raises this to 5g.
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    mem_reservation: ${WORKER_MEM_RESERVATION:-1g}
    logging: *default-logging

  beat:
    build:
      context: ./apps/api
      target: worker
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    env_file:
      - .env.production
    environment:
      CELERY_BROKER_URL: redis://redis-celery:6379/0
      CELERY_RESULT_BACKEND: redis://redis-celery:6379/1
    depends_on:
      redis-celery:
        condition: service_healthy
    mem_limit: ${BEAT_MEM_LIMIT:-1g}
    logging: *default-logging
    restart: unless-stopped

  # Celery monitoring UI. Bound to localhost only — reach it with an SSH
  # tunnel (`ssh -L 5555:127.0.0.1:5555 user@host`) instead of exposing it.
  # Change FLOWER_BASIC_AUTH in .env.production before enabling this service.
  flower:
    build:
      context: ./apps/api
      target: worker
    command: celery -A app.core.celery_app.celery_app flower --port=5555 --basic_auth=${FLOWER_BASIC_AUTH:-admin:change-me}
    env_file:
      - .env.production
    environment:
      CELERY_BROKER_URL: redis://redis-celery:6379/0
      CELERY_RESULT_BACKEND: redis://redis-celery:6379/1
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis-celery:
        condition: service_healthy
    mem_limit: ${FLOWER_MEM_LIMIT:-256m}
    logging: *default-logging
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    logging: *default-logging
    restart: unless-stopped

volumes:
  redis_data:
  redis_celery_data:
  api_storage:
  api_tmp:
  caddy_data:
  caddy_config:
