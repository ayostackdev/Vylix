name: campulse

services:
  - name: api
    source_dir: apps/api
    github:
      repo: YOUR_GITHUB_ORG/YOUR_REPO
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 4000
    build_command: npm run prisma:generate && npm run build
    run_command: npm run start
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_YOUR_POSTGRES_CONNECTION_STRING
      - key: PORT
        scope: RUN_TIME
        value: "4000"
      - key: PYTHON_SERVICE_URL
        scope: RUN_TIME
        value: https://YOUR-PYTHON-SERVICE-URL
      - key: SUPABASE_URL
        scope: RUN_TIME
        value: https://YOUR-PROJECT.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_SUPABASE_SERVICE_ROLE_KEY
      - key: SUPABASE_STORAGE_BUCKET
        scope: RUN_TIME
        value: materials

  - name: web
    source_dir: apps/web
    github:
      repo: YOUR_GITHUB_ORG/YOUR_REPO
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 3000
    build_command: npm run build
    run_command: npm run start
    envs:
      - key: NEXT_PUBLIC_API_BASE_URL
        scope: RUN_TIME
        value: https://YOUR-API-SERVICE-URL
      - key: NEXT_PUBLIC_SUPABASE_URL
        scope: RUN_TIME
        value: https://YOUR-PROJECT.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_SUPABASE_ANON_KEY

