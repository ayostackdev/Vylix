name: campulse

services:
  - name: api
    source_dir: apps/api
    github:
      repo: Ayostack-web/CamPulse
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 4000
    build_command: npm run prisma:generate && npm run build
    run_command: npm run start
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_YOUR_POSTGRES_CONNECTION_STRING
      - key: DIRECT_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_YOUR_SUPABASE_SESSION_POOLER_CONNECTION_STRING
      - key: PORT
        scope: RUN_TIME
        value: "4000"
      - key: PYTHON_SERVICE_URL
        scope: RUN_TIME
        value: https://YOUR-PYTHON-SERVICE-URL
      - key: REDIS_URL
        scope: RUN_TIME
        value: redis://YOUR-REDIS-HOST:6379/0
      - key: MAINTENANCE_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_A_STRONG_INTERNAL_KEY
      - key: SUPABASE_URL
        scope: RUN_TIME
        value: https://YOUR-PROJECT.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_SUPABASE_SERVICE_ROLE_KEY
      - key: SUPABASE_STORAGE_BUCKET
        scope: RUN_TIME
        value: materials
  - name: python-service
    source_dir: apps/python-service
    github:
      repo: YOUR_GITHUB_ORG/YOUR_REPO
      branch: main
      deploy_on_push: true
    environment_slug: python
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8000
    build_command: pip install -r requirements.txt
    run_command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envs:
      - key: POSTGRES_DSN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_YOUR_POSTGRES_CONNECTION_STRING
      - key: CELERY_BROKER_URL
        scope: RUN_TIME
        value: redis://YOUR-REDIS-HOST:6379/0
      - key: CELERY_RESULT_BACKEND
        scope: RUN_TIME
        value: redis://YOUR-REDIS-HOST:6379/1
      - key: PORT
        scope: RUN_TIME
        value: "8000"
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: http://localhost:3000
      - key: MAX_UPLOAD_MB
        scope: RUN_TIME
        value: "50"
      - key: TEMP_DIR
        scope: RUN_TIME
        value: ./tmp
      - key: UPLOAD_DIR
        scope: RUN_TIME
        value: ./storage/uploads