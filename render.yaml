# Render Blueprint for Vylix API (web + Celery worker + Celery beat)
# Deploy: https://render.com -> New -> Blueprint, point at this repo, select this file.
# After the first deploy, set the `sync: false` env vars in each service's dashboard.
services:
  - type: web
    name: vylix-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements-lean.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars: &shared_env
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://vylix.vercel.app,https://vylix-web.vercel.app
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: STORAGE_PROVIDER
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_AVATARS_BUCKET
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: MAINTENANCE_API_KEY
        sync: false

  - type: worker
    name: vylix-celery-worker
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=2
    envVars: *shared_env

  - type: worker
    name: vylix-celery-beat
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app.celery_app beat --loglevel=info
    envVars: *shared_env
