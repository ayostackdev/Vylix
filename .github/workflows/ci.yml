name: CI

on:
  push:
    branches: [main, develop, 'chore/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  lint-web:
    name: Lint Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint -w @vylix/web
      - run: npx prettier --check "apps/web/**/*.{ts,tsx,js,jsx,json,css}"

  typecheck-web:
    name: Typecheck Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck -w @vylix/web

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test -w @vylix/web

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vylix
          POSTGRES_PASSWORD: vylix
          POSTGRES_DB: vylix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://vylix:vylix@localhost:5432/vylix_test
          REDIS_URL: redis://localhost:6379/0
          SUPABASE_JWT_SECRET: test-secret-for-ci
          CORS_ORIGINS: http://localhost:3000
        run: pytest -v

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [lint-web, typecheck-web, test-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w @vylix/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
