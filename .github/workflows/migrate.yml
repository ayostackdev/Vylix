name: Migrate Database

# Runs Alembic migrations against the production Supabase project.
# The DATABASE_URL secret must be a *direct* (non-pooler) connection string,
# e.g. postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#
# Add the secret in: GitHub -> Settings -> Secrets and variables -> Actions -> New secret -> DATABASE_URL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/migrations/**'

concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  migrate:
    name: Apply migrations to Supabase
    runs-on: ubuntu-latest
    if: ${{ env.DATABASE_URL != '' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install alembic
        working-directory: apps/api
        run: pip install -r requirements-lean.txt
      - name: Show current revision
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m alembic current
      - name: Upgrade to head
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m alembic upgrade head
      - name: Confirm head revision
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m alembic current