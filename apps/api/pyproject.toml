[project]
name = "vylix-api"
version = "2.0.0"
description = "Vylix API backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "alembic>=1.13.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.5.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "celery>=5.4.0",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "PyJWT>=2.8.0",
  "Pillow>=10.4.0",
  "PyMuPDF>=1.24.0",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.5.0",
  "google-genai>=1.0.0",
  "slowapi>=0.1.9",
  "google-auth-oauthlib>=1.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
